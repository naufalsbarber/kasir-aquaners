<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1f55">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kasir Aquaners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Aquaners: navy royal + silver + cyan (palet dari logo/poster) */
:root{
  --navy:#0a1f55; --navy2:#12307f; --royal:#1a3aa8; --cyan:#1c9be0; --cyan2:#6cc4f2;
  --silver:#c9cdd5; --silver2:#e8ebf0; --paper:#ffffff; --bg:#eef1f6; --line:#d8deea;
  --ink:#0b1633; --muted:#5d6b86; --ok:#1f8a5b; --bad:#c0392b; --warn:#b7791f; --wa:#1f9d5a;
  --f-d:"Space Grotesk","Segoe UI",system-ui,sans-serif; --f-b:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1120px;margin:0 auto;padding-bottom:40px}

/* header */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
  padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(5,15,50,.25)}
.top .logo{background:linear-gradient(180deg,#d9dce2,#b9bec8);border-radius:10px;padding:3px 6px;display:flex;align-items:center;height:44px;flex:none;border:1px solid rgba(255,255,255,.5)}
.top .logo img{height:36px;width:auto;display:block;border-radius:6px}
.top .brand{flex:1;min-width:0}
.top .brand small{display:block;color:var(--cyan2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand b{display:block;font-family:var(--f-d);font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.clock{font-size:12px;color:#d6e2ff;text-align:right;cursor:default;line-height:1.35;white-space:nowrap}
.clock.manual{color:#ffcf8a;font-weight:700}
.pill{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.3);color:#dbe6ff;white-space:nowrap;background:rgba(255,255,255,.06)}
.pill.on{border-color:#4fbf8a;color:#a6efc9}.pill.off{border-color:#e58a7e;color:#ffc1b8}.pill.loc{border-color:#e6c27a;color:#ffe0a3}
.gear{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;width:36px;height:36px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.gear svg{width:18px;height:18px}
.gear.sel{background:var(--cyan);border-color:var(--cyan)}

/* tabs */
.tabs{display:flex;gap:6px;padding:12px max(14px,env(safe-area-inset-left));overflow-x:auto;position:sticky;top:64px;z-index:4;background:var(--bg)}
.tabs button{flex:1 1 0;min-width:96px;border:1px solid var(--line);background:var(--paper);padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.sel{background:linear-gradient(135deg,var(--royal),var(--navy2));color:#fff;border-color:var(--navy2);box-shadow:0 4px 12px -4px rgba(26,58,168,.6)}

main{padding:4px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.grid-2{grid-template-columns:1fr}.tabs{top:62px}}
h1{font-family:var(--f-d);font-size:22px;margin:0}
h2{font-family:var(--f-d);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .eb{background:var(--silver2);color:var(--navy2);padding:3px 8px;border-radius:6px;font-size:10.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(10,31,85,.05),0 8px 20px -12px rgba(10,31,85,.18)}
.card.dark{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-color:var(--navy)}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--f-d);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:12px}
label.f:first-child{margin-top:0}
input.in,select.in,textarea.in{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:var(--f-b);font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(28,155,224,.2)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button.sel{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.seg.pill-s button{border-radius:99px;padding:9px 14px;flex:0 0 auto;min-width:0;font-size:13px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:15px;background:linear-gradient(135deg,var(--royal),var(--navy2));color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),#1578c2)}
.btn.ghost{background:#fff;color:var(--navy2);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #efc3bd}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px;margin-top:0}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper button{border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:24px;font-weight:700;color:var(--navy2)}
.stepper input{text-align:center;font-weight:700;font-size:20px}
.total-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.total-line span:first-child{font-family:var(--f-d);letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--cyan2)}
.total-line b{font-size:24px;font-variant-numeric:tabular-nums}
.suggest{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;z-index:6;box-shadow:0 10px 24px -8px rgba(10,31,85,.3);overflow:hidden;display:none}
.suggest div{padding:11px 13px;border-top:1px solid var(--line)}
.suggest div:first-child{border-top:0}
.suggest div:hover,.suggest div:active{background:var(--silver2)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat span{display:block;font-size:11px;color:var(--muted);font-family:var(--f-d);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.stat b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-color:var(--navy)}
.stat.hero span{color:var(--cyan2)}
.stat.hero b{font-size:26px}
.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}

/* list */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted)}
.item .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item.void .t,.item.void .v{text-decoration:line-through;color:var(--muted)}
.empty{padding:20px 14px;color:var(--muted);font-size:13.5px;text-align:center}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;vertical-align:1px}
.tag.antar{background:#d7ecfa;color:#0f6aa8}.tag.asrama{background:#fbe6c8;color:#965a0b}.tag.void{background:#f7d9d5;color:var(--bad)}
.tag.tunai{background:#e3e8f1;color:#33425f}.tag.qris{background:#dcdcfa;color:#3a3ab0}.tag.transfer{background:#d6f0e4;color:#1c7a50}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--navy2)}
.mini.bad{color:var(--bad);border-color:#efc3bd}

/* receipt */
.receipt{background:#fff;border:1px dashed #aab4cc;border-radius:14px;padding:16px;font-family:var(--f-b)}
.receipt .logo{display:flex;justify-content:center}
.receipt .logo img{width:170px;border-radius:8px}
.receipt .nm{text-align:center;font-family:var(--f-d);font-weight:700;font-size:20px;letter-spacing:.06em;margin-top:6px}
.receipt .sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.receipt .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.receipt .r span:first-child{color:var(--muted)}
.receipt .r span:last-child{text-align:right;font-weight:600}
.receipt .tot{display:flex;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:2px solid var(--navy2);font-weight:800;font-size:18px}
.receipt .ft{text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px}
.empty-receipt{padding:34px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;background:#fafbfd}

/* table */
.scrollx{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-family:var(--f-d);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid #edf0f6;vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}.tbl tr.void td{color:#9aa5bd;text-decoration:line-through}
.tbl tr.tot td{font-weight:800;border-top:1.5px solid var(--navy2)}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv div:first-child{border-top:0}.kv div.strong{font-weight:800}

/* datebar */
.datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:stretch}
.datebar>button{border:1px solid var(--line);background:#fff;border-radius:12px;font-size:24px;line-height:1;color:var(--navy2)}
.datebar>button:disabled{opacity:.35}
.dlabel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;min-width:0}
.dlabel b{font-size:15px;white-space:nowrap}
.dlabel small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);font-family:var(--f-d)}
.dlabel small.past{color:var(--warn)}
.dlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}

/* chart */
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px;overflow-x:auto}
.bars .g{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:14px;flex:1}
.bars .g i{display:block;width:70%;max-width:18px;min-height:2px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--cyan),var(--royal))}
.bars.as .g i{background:linear-gradient(180deg,#f0a35a,#d4741d)}
.bars .g em{font-style:normal;font-size:9px;color:var(--muted);height:12px}
.bars .g u{text-decoration:none;font-size:9.5px;color:var(--muted);margin-top:3px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(6,14,40,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .18s ease-out;box-shadow:0 20px 50px -12px rgba(5,15,50,.5)}
.sheet.wide{max-width:760px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{margin:0;font-family:var(--f-d);font-size:18px}
.x{border:0;background:var(--silver2);width:34px;height:34px;border-radius:99px;font-size:18px;line-height:1;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sig{width:100%;height:170px;background:#fff;border:1.5px dashed #9fb0d4;border-radius:12px;touch-action:none;display:block}
.report-img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:92%;box-shadow:0 8px 24px rgba(5,15,50,.35)}
.banner{background:#fff4e0;border:1px solid #f0d49b;color:#7a4e07;border-radius:12px;padding:10px 14px;font-size:13px}
.ownertabs{display:flex;gap:6px;overflow-x:auto}
.ownertabs button{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted)}
.ownertabs button.sel{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--silver2);border-radius:99px;padding:7px 8px 7px 12px;font-weight:600;font-size:13px}
.chip button{border:0;background:#fff;width:22px;height:22px;border-radius:99px;font-size:13px;line-height:1;color:var(--bad)}
.addrow{display:flex;gap:8px}.addrow .in{flex:1}.addrow .btn{width:auto;margin-top:0;padding:0 18px}
</style>
</head>

const DB = {

  init() {

  async flush() {

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));

}

async function shareBlob(blob, name, title) {
  const file = new File([blob], name, { type: blob.type });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return 'shared'; } }
  catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('File diunduh: ' + name);
  return 'download';
}

async function pdfFromCanvas(cv, { wMM, quality = .92, px = false } = {}) {
  await loadScript(JSPDF_SRC);
  const { jsPDF } = window.jspdf;
  const W = cv.width, H = cv.height;
  const url = cv.toDataURL('image/jpeg', quality);
  let doc;
  if (wMM) { const hMM = wMM * H / W; doc = new jsPDF({ orientation: hMM > wMM ? 'portrait' : 'landscape', unit: 'mm', format: [wMM, hMM], compress: true }); doc.addImage(url, 'JPEG', 0, 0, wMM, hMM); }
  else { doc = new jsPDF({ orientation: H > W ? 'portrait' : 'landscape', unit: 'px', format: [W, H], hotfixes: ['px_scaling'], compress: true }); doc.addImage(url, 'JPEG', 0, 0, W, H); }
  return doc.output('blob');
}

/* ============================================================
   STRUK — digambar langsung di canvas (tanpa html2canvas)
   • thermal: 384px = kertas 58mm, hitam-putih, ukuran huruf besar
   • warna  : untuk dikirim ke WhatsApp / disimpan sebagai gambar
   Cetak: bikin PDF lebar 48mm lalu Bagikan → pilih Thermer
   ============================================================ */
function wrapText(x, text, maxW) {
  const words = String(text ?? '').split(/\s+/).filter(Boolean), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
    while (x.measureText(cur).width > maxW && cur.length > 1) {   // kata sangat panjang: potong
      let n = cur.length - 1; while (n > 1 && x.measureText(cur.slice(0, n)).width > maxW) n--;
      lines.push(cur.slice(0, n)); cur = cur.slice(n);
    }
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}
function dropShape(x, cx, cy, s) {
  x.beginPath(); x.moveTo(cx, cy - s);
  x.bezierCurveTo(cx + .95 * s, cy - .05 * s, cx + .75 * s, cy + .95 * s, cx, cy + .95 * s);
  x.bezierCurveTo(cx - .75 * s, cy + .95 * s, cx - .95 * s, cy - .05 * s, cx, cy - s); x.closePath();
}
function strukRows(t) {
  const hs = getHarga(t.ukuran, t.antar ? 'antar' : 'ambil'), uk = t.ukuran === 'kecil' ? 'Kecil' : 'Besar';
  const r = [['Tanggal', t.date + ' ' + hhmmOf(t)], [t.isAsrama ? 'Asrama' : 'Pelanggan', t.customerName || '-']];
  r.push([`Galon ${uk}`, t.isAsrama ? String(t.jumlah) : `${t.jumlah} x ${rp(hs)}`]);
  if (!t.isAsrama) {
    r.push(['Ambil', t.antar ? 'Diantar' : 'Ambil sendiri']);
    if (t.antar && t.address) r.push(['Alamat', t.address]);
    r.push(['Bayar', bayarLabel(t.payment)]);
  }
  if (t.catatan) r.push(['Catatan', t.catatan]);
  return r;
}
async function drawStruk(t, { color = false } = {}) {
  try { await document.fonts.ready; } catch (e) { }
  const logo = color ? await loadLogo() : null;
  const s = ST(), k = color ? 2 : 1, W = 384, PAD = 14;
  const cv = document.createElement('canvas'); cv.width = W * k; cv.height = 2600 * k;
  const x = cv.getContext('2d'); x.scale(k, k);
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, 2600);
  const ink = '#000', soft = color ? '#55627d' : '#000', accent = color ? '#12307f' : '#000';
  const FF = '"Inter","Segoe UI",Arial,sans-serif';
  const F = (w, sz) => x.font = `${w} ${sz}px ${FF}`;
  const txt = (tx, X, Y, { a = 'left', c = ink } = {}) => { x.fillStyle = c; x.textAlign = a; x.fillText(tx, X, Y); };
  const dash = () => { x.save(); x.strokeStyle = color ? '#9aa8c8' : '#000'; x.lineWidth = 2; x.setLineDash([6, 5]); x.beginPath(); x.moveTo(PAD, y); x.lineTo(W - PAD, y); x.stroke(); x.restore(); y += 16; };
  let y = 14;
  // header
  if (color && logo) { const lw = 220, lh = lw * logo.height / logo.width; x.drawImage(logo, (W - lw) / 2, y, lw, lh); y += lh + 18; }
  else { x.fillStyle = '#000'; dropShape(x, W / 2, y + 26, 24); x.fill(); y += 62; F(800, 40); txt((s.toko || 'AQUANERS').toUpperCase(), W / 2, y + 30, { a: 'center', c: accent }); y += 46; }
  F(700, 22); txt(s.tagline || 'Steril Refill Water', W / 2, y + 16, { a: 'center', c: soft }); y += 32;
  F(500, 18); x.textBaseline = 'alphabetic';
  if (!t.isAsrama) for (const l of wrapText(x, s.alamat || '', W - 2 * PAD)) { txt(l, W / 2, y + 14, { a: 'center', c: soft }); y += 24; }
  else { txt('Konsumsi Internal · Asrama', W / 2, y + 14, { a: 'center', c: soft }); y += 24; }
  y += 6; dash();
  // baris data
  for (const [lab, val] of strukRows(t)) {
    F(500, 24); const lw = Math.min(150, x.measureText(lab).width + 12);
    F(700, 26); const lines = wrapText(x, val, W - 2 * PAD - lw);
    F(500, 24); txt(lab, PAD, y + 24, { c: soft });
    F(700, 26); lines.forEach((l, i) => { txt(l, W - PAD, y + 24 + i * 32, { a: 'right' }); });
    y += Math.max(36, lines.length * 32 + 6);
  }
  y += 4; dash();
  if (t.isAsrama) { F(800, 28); txt('INTERNAL · ASRAMA', W / 2, y + 30, { a: 'center', c: accent }); y += 50; }
  else { F(800, 30); txt('TOTAL', PAD, y + 40, { c: accent }); F(800, 42); txt(rp(t.total), W - PAD, y + 42, { a: 'right', c: accent }); y += 66; }
  dash();
  F(500, 22); txt('Dicatat oleh ' + (t.kasir || '-'), W / 2, y + 22, { a: 'center', c: soft }); y += 34;
  F(600, 22); for (const l of wrapText(x, s.footer || '', W - 2 * PAD)) { txt(l, W / 2, y + 22, { a: 'center', c: soft }); y += 30; }
  if (s.kontak) { F(500, 18); for (const l of wrapText(x, s.kontak, W - 2 * PAD)) { txt(l, W / 2, y + 18, { a: 'center', c: soft }); y += 26; } }
  y += color ? 22 : 54;     // jarak sobek kertas thermal
  const out = document.createElement('canvas'); out.width = W * k; out.height = Math.ceil(y * k);
  out.getContext('2d').drawImage(cv, 0, 0);
  return out;
}
const strukName = (t, ext) => `struk-aquaners-${t.date}-${hhmmOf(t).replace(':', '')}.${ext}`;

/* tanggal transaksi (input susulan): hanya tanggal, jam ikut jam sekarang */
function bizDate() { const t = today(); return S.tglInput && /^\d{4}-\d{2}-\d{2}$/.test(S.tglInput) && S.tglInput < t ? S.tglInput : t; }
function bizAt() { const n = getNow(), bd = bizDate(); if (bd === today()) return n; const [y, m, d] = bd.split('-').map(Number); return new Date(y, m - 1, d, n.getHours(), n.getMinutes()); }
function tglField() {
  return `<label class="f">Tanggal <span style="text-transform:none;font-weight:400">(ubah kalau input susulan)</span></label>
    <input class="in" type="date" id="f-tgl" max="${today()}" value="${bizDate()}"><div class="hint" id="tgl-hint" style="margin-top:6px"></div>`;
}
function tglHint() {
  const h = $('#tgl-hint'); if (!h) return; const bd = bizDate(), on = bd !== today();
  const [y, m, d] = bd.split('-'); h.innerHTML = on ? `<b style="color:#b7791f">Input susulan: akan tercatat tanggal ${d}/${m}/${y}.</b> <a href="#" id="tgl-reset" style="color:var(--royal)">Kembali ke hari ini</a>` : '';
  const r = $('#tgl-reset'); if (r) r.onclick = e => { e.preventDefault(); S.tglInput = ''; $('#f-tgl').value = today(); tglHint(); refreshDateLists(); };
}
function refreshDateLists() { if (S.tab === 'kasir') renderToday(); else if (S.tab === 'pengeluaran') renderExpToday(); }
function setupTgl() {
  const el = $('#f-tgl'); if (!el) return; tglHint();
  el.onchange = el.oninput = () => { const v = el.value; S.tglInput = (!v || v >= today()) ? '' : v; if (!v || v > today()) { el.value = today(); if (v > today()) toast('Tanggal tidak boleh di masa depan'); } tglHint(); refreshDateLists(); };
}

function setupSuggest() {

    if (!m.length) { box.style.display = 'none'; return; }
    box.innerHTML = m.map((n, i) => `<div data-i="${i}">${esc(n)}</div>`).join(''); box.style.display = 'block';
    $$('div', box).forEach(el => el.onmousedown = e => { e.preventDefault(); inp.value = m[+el.dataset.i]; box.style.display = 'none'; fillAddr(); });
  };
  const fillAddr = () => {
    const c = custAll().find(c => c.name.toLowerCase() === inp.value.trim().toLowerCase());

function findOrCreateCust(name, address) {
  name = name.trim(); if (!name) return null;
  let c = DB.list('cust').find(c => c.name.toLowerCase() === name.toLowerCase());
  if (!c) c = { id: uid('c'), name, phone: '', address: address || '' };
  else { if (address) c.address = address; delete c.hapus; }
  DB.put('cust', c); return c;
}

    if (!F.ambil) return toast('Pilih dulu "Ambil sendiri" atau "Diantar" ya.', 3500);
    if (!F.bayar) return toast('Pilih dulu metode pembayarannya (Tunai/QRIS/Transfer).', 3500);

async function batalTrx(id) {

  t.batal = true; t.batalAlasan = why; t.batalAt = nowISO(); t.batalOleh = S.kasir || 'Owner'; addLog(t, 'Batal', why);

  if (!t.isAsrama) {

  };
}

function custStats(id) {
  const l = okTrx().filter(t => t.customerId === id);
  return { count: l.length, galon: sum(l, t => t.jumlah), total: sum(l, t => t.total), list: l };
}

async function custDetail(id) {
  const c = DB.get(id); if (!c) return;
  const sh = openSheet(`<div class="hd"><h3>${esc(c.name)}</h3><button class="x" id="cx">×</button></div>
    <div class="hint">${c.phone ? esc(c.phone) : 'Belum ada nomor WhatsApp'}${c.address ? '<br>📍 ' + esc(c.address) : ''}</div>
    <div class="grid2"><div class="stat"><span>Total galon</span><b id="cg">…</b></div><div class="stat"><span>Total belanja</span><b id="ct">…</b></div></div>
    <div class="grid2"><button class="btn ghost" id="ced" style="margin-top:0">Edit</button><button class="btn danger" id="cdel" style="margin-top:0">Hapus</button></div>
    <h2 style="margin:6px 0 0">Riwayat transaksi</h2><div id="ch" class="list"><div class="empty">Memuat…</div></div>`);
  $('#cx', sh).onclick = closeSheet;
  $('#ced', sh).onclick = () => { closeSheet(); custForm(c); };
  $('#cdel', sh).onclick = async () => {
    const st = custStats(c.id);
    if (!await ask({ title: 'Hapus pelanggan?', body: `Hapus "${c.name}"?${st.count ? `\n\nRiwayat ${st.count} transaksinya tetap aman di Laporan; hanya hilang dari daftar Pelanggan.` : ''}`, ok: 'Hapus', danger: true })) return;

    $('#ch').innerHTML = st.list.length ? st.list.slice(0, 40).map(t => `<div class="item"><div class="main"><div class="t">${fmtTglS(t.date)} · ${t.jumlah} galon${t.antar ? ' (antar)' : ''}</div></div><div class="v">${rp(t.total)}</div></div>`).join('') : '<div class="empty">Belum ada transaksi.</div>';
  };
  paint();
  if (DB.online()) {   // riwayat lengkap dari server
    try { DB.merge(await DB.fetchWhere('col=eq.trx&data->>customerId=eq.' + encodeURIComponent(id))); paint(); } catch (e) { }
  }
}
function custForm(c) {
  const sh = openSheet(`<div class="hd"><h3>${c ? 'Edit pelanggan' : 'Tambah pelanggan'}</h3><button class="x" id="cx">×</button></div>
    <label class="f">Nama<input class="in" id="n-nama" value="${esc(c ? c.name : '')}"></label>
    <label class="f">No. WhatsApp (opsional)<input class="in" id="n-hp" inputmode="numeric" placeholder="08xxxxxxxxxx" value="${esc(c ? c.phone || '' : '')}"></label>
    <label class="f">Alamat (opsional)<input class="in" id="n-al" value="${esc(c ? c.address || '' : '')}"></label>

  $('#n-ok', sh).onclick = () => {
    const name = $('#n-nama', sh).value.trim(), phone = $('#n-hp', sh).value.trim(), address = $('#n-al', sh).value.trim();

    if (dup) return toast('Nama itu sudah dipakai pelanggan lain');

      c.name = name; c.phone = phone; c.address = address; DB.put('cust', c);

    } else DB.put('cust', { id: uid('c'), name, phone, address });

const C = { navy: '#0a1f55', navy2: '#12307f', royal: '#1a3aa8', cyan: '#1c9be0', cyan2: '#6cc4f2', line: '#d8deea', muted: '#5d6b86', ink: '#0b1633', ok: '#1f8a5b', bad: '#c0392b', paper: '#f4f7fc', warn: '#b7791f', orange: '#d4741d' };

/* painter: dua putaran (ukur tinggi → gambar) supaya laporan sepanjang apa pun muat */
async function paintReport(W, build) {
  try { await document.fonts.ready; } catch (e) { }
  const logo = await loadLogo();
  const mk = (cv) => {
    const x = cv ? cv.getContext('2d') : null, dry = !cv;
    const o = { x, dry, W, y: 0, logo, P: 56 };
    o.rect = (a, b, w, h, c) => { if (dry) return; x.fillStyle = c; x.fillRect(a, b, w, h); };
    o.rrect = (a, b, w, h, r, c, stroke) => {
      if (dry) return; x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
      if (c) { x.fillStyle = c; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = 2; x.stroke(); }
    };
    o.txt = (t, X, Y, { a = 'left', c = C.ink, w = 500, sz = 28, f = 'Inter' } = {}) => { if (dry) return; x.font = FONT(w, sz, f); x.fillStyle = c; x.textAlign = a; x.fillText(String(t), X, Y); };
    o.lines = (t, maxW, { w = 500, sz = 26 } = {}) => { const s = SCRATCH(); s.font = FONT(w, sz); return wrapText(s, t, maxW); };
    o.cut = (t, maxW, { w = 500, sz = 28 } = {}) => { const s = SCRATCH(); s.font = FONT(w, sz); let r = String(t); while (r.length > 1 && s.measureText(r).width > maxW) r = r.slice(0, -1); return r === String(t) ? r : r.trimEnd() + '…'; };
    return o;
  };
  const d = mk(null); d.y = 0; const H = Math.ceil(build(d) + 10);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const o = mk(cv); o.x.fillStyle = '#fff'; o.x.fillRect(0, 0, W, H); build(o);

}
function repHeader(o, title, sub) {

    if (o.logo) o.x.drawImage(o.logo, P + 12, 48, cw - 24, (cw - 24) * o.logo.height / o.logo.width);

}
function repSec(o, t) {

function repKV(o, k, v, { bold = false, c = C.ink, sz = 28, sub = '' } = {}) {

function repBox(o, X, w, h, lab, val, dark, vsz = 42) {

function repTable(o, cols, rows, { voidIdx = [], total = null } = {}) {

function dayData(d) {
  const tx = trxOn(d), jl = jual(tx), as = asr(tx), pg = expOn(d), by = m => sum(jl.filter(t => t.payment === m), t => t.total);
  return {

    tunai: by('tunai'), qris: by('qris'), transfer: by('transfer'), pengeluaran: sum(pg, e => e.jumlahBiaya), galonAsrama: sum(as, t => t.jumlah),
    batalN: allTrx().filter(t => t.date === d && t.batal).length + allExp().filter(e => e.date === d && e.batal).length
  };
}
function monthData(ym) {
  const n = daysIn(ym), tx = trxMonth(ym), jl = jual(tx), as = asr(tx), pg = expMonth(ym);
  const jualArr = new Array(n).fill(0), asArr = new Array(n).fill(0), perDay = [];
  tx.forEach(t => { const i = +t.date.slice(8, 10) - 1; if (t.isAsrama) asArr[i] += t.jumlah; else jualArr[i] += t.jumlah; });
  for (let i = 1; i <= n; i++) {
    const d = ym + '-' + pad(i), j = jl.filter(t => t.date === d), p = pg.filter(e => e.date === d);
    perDay.push({ d, trx: j.length, galon: sum(j, t => t.jumlah), asrama: sum(as.filter(t => t.date === d), t => t.jumlah), masuk: sum(j, t => t.total), keluar: sum(p, e => e.jumlahBiaya) });
  }
  const by = m => sum(jl.filter(t => t.payment === m), t => t.total);
  const asramaBy = {}; as.forEach(t => asramaBy[t.customerName] = (asramaBy[t.customerName] || 0) + t.jumlah);
  const kat = {}; pg.forEach(e => kat[e.kategori] = (kat[e.kategori] || 0) + e.jumlahBiaya);
  const ambil = jl.filter(t => !t.antar), antar = jl.filter(t => t.antar);
  return {
    ym, n, tx, jl, as, pg, jualArr, asArr, perDay, asramaBy, kat, ambil, antar,
    pemasukan: sum(jl, t => t.total), galon: sum(jl, t => t.jumlah), galonAsrama: sum(as, t => t.jumlah), pengeluaran: sum(pg, e => e.jumlahBiaya),
    tunai: by('tunai'), qris: by('qris'), transfer: by('transfer'), hariAktif: perDay.filter(p => p.trx || p.asrama).length
  };
}

function sigPad(cv) {
  const r = cv.getBoundingClientRect(), k = 2; cv.width = Math.max(300, r.width) * k; cv.height = Math.max(120, r.height) * k;
  const x = cv.getContext('2d'); x.scale(k, k); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = C.navy;
  let down = false, has = false;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { down = true; has = true; const [a, b] = pos(e); x.beginPath(); x.moveTo(a, b); cv.setPointerCapture?.(e.pointerId); e.preventDefault(); };
  cv.onpointermove = e => { if (!down) return; const [a, b] = pos(e); x.lineTo(a, b); x.stroke(); e.preventDefault(); };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
  return { clear: () => { x.clearRect(0, 0, cv.width, cv.height); has = false; }, empty: () => !has, data: () => cv.toDataURL('image/png') };
}

  const km = {}; trx.forEach(t => { const k = t.date.slice(0, 7) + '|' + (t.kasir || 'Tidak diketahui'); (km[k] ||= []).push(t); });
  const rekK = Object.keys(km).sort().map(k => { const [m, n] = k.split('|'), l = km[k]; return { 'Bulan': mlabel(m), 'Kasir': n, 'Jumlah Transaksi': l.length, 'Transaksi Jual': jual(l).length, 'Galon Terjual': sum(jual(l), t => t.jumlah), 'Omzet Dicatat': sum(jual(l), t => t.total), 'Transaksi Asrama': asr(l).length }; });
  const raw = trx.map(t => ({ 'Tanggal': t.date, 'Waktu': hhmmOf(t), 'Nama': t.customerName, 'Tipe': t.isAsrama ? 'Asrama' : 'Jual', 'Jumlah Galon': t.jumlah, 'Ukuran': t.ukuran === 'kecil' ? 'Kecil' : 'Besar', 'Pengambilan': t.isAsrama ? '-' : (t.antar ? 'Diantar' : 'Ambil sendiri'), 'Alamat': t.address || '', 'Metode Bayar': t.isAsrama ? '-' : bayarLabel(t.payment), 'Catatan': t.catatan || '', 'Kasir': t.kasir || '', 'Total (Rp)': t.isAsrama ? 0 : t.total }));
  const pg = okExp().slice().reverse().map(e => ({ 'Tanggal': e.date, 'Waktu': hhmmOf(e), 'Jenis': e.kategori, 'Biaya (Rp)': e.jumlahBiaya, 'Bukti': e.bukti || '', 'Keterangan': e.keterangan || '', 'Kasir': e.kasir || '' }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rek), 'Rekap Bulanan');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rekK), 'Rekap per Kasir');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(raw), 'Transaksi');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pg.length ? pg : [{ 'Info': 'Belum ada pengeluaran' }]), 'Pengeluaran');
  await saveXlsx(wb, `aquaners-laporan-${today()}.xlsx`);
}
async function exportAsramaMatrix(ym) {
  if (!await needXLSX()) return;
  const as = asr(trxMonth(ym)); if (!as.length) return toast('Belum ada data asrama di bulan itu');
  const n = daysIn(ym), names = [...new Set(as.map(t => t.customerName))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const mx = {}; for (let d = 1; d <= n; d++) { mx[d] = {}; names.forEach(x => mx[d][x] = 0); }
  as.forEach(t => { mx[+t.date.slice(8, 10)][t.customerName] += t.jumlah; });
  const rows = [['TANGGAL', ...names]]; for (let d = 1; d <= n; d++) rows.push([d, ...names.map(x => mx[d][x] || '')]);
  const rata = ['RATA-RATA'], jum = ['JUMLAH'];
  names.forEach(x => { let t = 0, a = 0; for (let d = 1; d <= n; d++) { const v = mx[d][x]; if (v > 0) { t += v; a++; } } jum.push(t); rata.push(a ? Math.round(t / a * 10) / 10 : 0); });
  rows.push(rata, jum);
  const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{ wch: 10 }, ...names.map(() => ({ wch: 10 }))];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, ('Asrama ' + fmtBln(ym)).slice(0, 31));
  await saveXlsx(wb, `aquaners-rincian-asrama-${ym}.xlsx`);
}

      <button class="btn" id="pgo">Masuk</button>
      <button class="btn ghost" id="forgot">Lupa PIN?</button></div>`;

    <div class="addrow" style="margin-top:10px"><input class="in" placeholder="${esc(ph)}"><button class="btn">Tambah</button></div>`;
  $$('[data-x]', el).forEach(b => b.onclick = () => { const st = ST(); st[key].splice(+b.dataset.x, 1); DB.put('settings', st); chipEditor(el, key, label, ph); toast('Disimpan'); });
  $('button.btn', el).onclick = () => { const i = $('input', el), v = i.value.trim(); if (!v) return; const st = ST(); if (!st[key].includes(v)) st[key].push(v); DB.put('settings', st); chipEditor(el, key, label, ph); toast('Disimpan'); };
  $('input', el).onkeydown = e => { if (e.key === 'Enter') $('button.btn', el).click(); };
}

  $$('[data-s]', el).forEach(i => i.onchange = () => { const st = ST(); st[i.dataset.s] = i.value.trim(); DB.put('settings', st); toast('Disimpan'); if (i.dataset.s === 'toko') { shell(); render(); } });

  chipEditor($('#ck', el), 'kasir', 'Daftar kasir', 'Nama kasir baru');

  $('#tmset', el).onclick = () => { const d = new Date($('#tm', el).value); if (isNaN(d)) return toast('Isi tanggal & jam dulu'); TIME_OVERRIDE = d; lsSet('timeOverride', d.toISOString()); tickClock(); vOwner(); toast('Waktu manual aktif'); };
  $('#tmoff', el).onclick = () => { TIME_OVERRIDE = null; lsSet('timeOverride', null); tickClock(); vOwner(); toast('Waktu kembali otomatis'); };

const ldt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* ---------- DATA ---------- */
function oData(el) {
  const cnt = c => DB.list(c).filter(d => !d.batal && !d.hapus).length;
  el.innerHTML = `<div class="card"><h2>Backup data</h2><div class="hint">Simpan semua data (transaksi, pelanggan, pengeluaran, pengaturan) ke satu file .json. Simpan di Google Drive atau kirim ke WA sendiri.</div><button class="btn" id="exp">Export backup</button></div>
    <div class="card"><h2>Import dari backup</h2><div class="hint">Bisa membaca backup lama dari aplikasi Aquaners (APK/web lama) maupun backup dari web baru ini. Data yang sudah ada tidak akan dobel.</div>
      <label class="btn ghost" for="impF" style="cursor:pointer">Pilih file backup (.json)</label><input id="impF" type="file" accept=".json,application/json" hidden></div>
    <div class="card" style="border-color:#efc3bd"><h2 style="color:var(--bad)">Reset data</h2><div class="hint">Untuk mulai dari nol setelah uji coba. Tidak bisa dibatalkan, jadi export backup dulu.</div>
      <div class="kv" style="margin:8px 0"><div><span>Transaksi</span><b>${cnt('trx')}</b></div><div><span>Pengeluaran</span><b>${cnt('exp')}</b></div><div><span>Pelanggan</span><b>${cnt('cust')}</b></div></div>
      <button class="btn danger" id="rst1">Reset transaksi saja</button><div class="hint">Menghapus transaksi, pengeluaran, dan pelanggan. Pengaturan, harga, dan PIN tetap.</div>
      <button class="btn danger" id="rst2">Reset total</button><div class="hint">Menghapus semuanya termasuk pengaturan (PIN kembali 123456). Koneksi online tetap tersimpan.</div></div>`;
  $('#exp', el).onclick = exportBackup;
  $('#impF', el).onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };
  $('#rst1', el).onclick = () => resetData('transaksi'); $('#rst2', el).onclick = () => resetData('total');
}
async function exportBackup() {
  toast('Menyiapkan backup…');
  let docs; try { docs = await DB.fetchAll(); } catch (e) { return toast('Gagal mengambil data online: ' + e.message, 5000); }
  const map = Object.fromEntries(docs.map(d => [d.id, d])); Object.values(DB.pending).forEach(d => map[d.id] = d);
  const out = { app: APP_ID, versi: 1, dibuat: realISO(), jumlah: Object.keys(map).length, docs: Object.values(map) };
  await shareBlob(new Blob([JSON.stringify(out)], { type: 'application/json' }), `Backup-Kasir-Aquaners-${dstr(new Date())}_${hhmm(new Date()).replace(':', '')}.json`, 'Backup Kasir Aquaners');
}
const OLD_TS = '2001-01-01T00:00:00.000Z';
function oldToDocs(data) {   // format lama: {app:'aquaners-kasir', customers, transactions, expenses}
  const docs = [], tsOf = (d, t) => { const x = new Date(d + 'T' + String(t || '00:00').replace('.', ':').padStart(5, '0') + ':00+07:00'); return isNaN(x) ? OLD_TS : x.toISOString(); };
  (data.customers || []).forEach(c => { if (c && c.id && c.name) docs.push({ id: c.id, col: 'cust', tgl: null, data: { ...c }, updated_at: OLD_TS }); });
  (data.transactions || []).forEach(t => { if (t && t.id && t.date) docs.push({ id: t.id, col: 'trx', tgl: t.date, data: { log: [], ...t, at: t.at || tsOf(t.date, t.time) }, updated_at: tsOf(t.date, t.time) }); });
  (data.expenses || []).forEach(e => { if (e && e.id && e.date) docs.push({ id: e.id, col: 'exp', tgl: e.date, data: { log: [], ...e, at: e.at || tsOf(e.date, e.time) }, updated_at: tsOf(e.date, e.time) }); });
  return docs;
}
async function importBackup(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('File tidak bisa dibaca. Pastikan ini file backup .json', 4000); }
  let docs, ket;
  if (data && data.app === APP_ID && Array.isArray(data.docs)) { docs = data.docs; ket = `File berisi ${docs.length} data, dibuat ${String(data.dibuat).slice(0, 10)}.`; }
  else if (data && Array.isArray(data.transactions) && Array.isArray(data.customers)) {
    docs = oldToDocs(data); ket = `Backup lama Aquaners: ${data.transactions.length} transaksi, ${data.customers.length} pelanggan, ${(data.expenses || []).length} pengeluaran.`;
  } else return toast('Ini bukan file backup Aquaners', 4000);
  if (!await ask({ title: 'Import backup?', body: ket + '\nData yang sama tidak akan dobel.', ok: 'Import' })) return;
  let baru = 0, upd = 0, skip = 0;
  for (const d of docs) {
    if (!d || !d.id || !d.col || !d.data || d.id === 'reset' || (d.col === 'settings' && DB.docs.settings && data.app !== APP_ID)) { skip++; continue; }
    const cur = DB.docs[d.id];
    if (cur && new Date(cur.updated_at) >= new Date(d.updated_at)) { skip++; continue; }
    cur ? upd++ : baru++; DB.docs[d.id] = d; DB.pending[d.id] = d;
  }
  DB.saveCache(); DB.flush(); shell(); render();
  ask({ title: 'Import selesai', body: `${baru} data baru ditambahkan, ${upd} diperbarui, ${skip} dilewati karena sudah ada atau lebih baru.\n\nData lama akan terkirim ke online di latar belakang (lihat status di kanan atas).`, ok: 'OK', noCancel: true });
}
async function resetData(scope) {
  const total = scope === 'total';
  const s1 = await ask({ title: total ? 'Reset total?' : 'Reset transaksi?', body: 'Sebaiknya export backup dulu. Tekan "Export dulu" untuk menyimpan backup, lalu ulangi reset.', ok: 'Lanjut tanpa backup', cancel: 'Export dulu', danger: true });
  if (!s1) return exportBackup();
  const typed = await ask({ title: 'Ketik HAPUS untuk konfirmasi', body: total ? 'Semua data dan pengaturan dihapus dari semua perangkat yang tersambung.' : 'Transaksi, pengeluaran, dan pelanggan dihapus dari semua perangkat yang tersambung.', input: { label: 'Konfirmasi', ph: 'HAPUS', required: 'Ketik HAPUS' }, ok: 'Hapus permanen', danger: true });
  if (typed == null) return;
  if (typed.trim().toUpperCase() !== 'HAPUS') return toast('Konfirmasi salah, tidak ada yang dihapus');
  try { await DB.remove(total ? 'id=not.is.null' : 'col=in.(' + TX_COLS.join(',') + ')'); }
  catch (e) { return toast('Gagal menghapus data online: ' + e.message, 6000); }
  const at = realISO(); wipeLocal(total ? null : TX_COLS, at);
  DB.put('meta', { id: 'reset', at, scope }); lsSet('resetSeen', at);
  if (total) { DB.put('settings', JSON.parse(JSON.stringify(DEF_SETTINGS))); S.kasir = ''; lsSet('kasir', ''); S.owner = false; ssSet('owner', '0'); }
  S.rcpt = null; S.tab = 'kasir'; shell(); render();
  toast(total ? 'Reset total selesai' : 'Data transaksi direset. Mulai dari nol!', 3500);
}

/* ---------- KONEKSI ---------- */
function oKoneksi(el) {
  const n = Object.keys(DB.pending).length;
  el.innerHTML = `<div class="card"><h2>Koneksi online (Supabase)</h2>
    <label class="f">Project URL<input class="in" id="cu" value="${esc(DB.cfg.url)}"></label>
    <label class="f">Publishable / anon key<input class="in" id="ck" value="${esc(DB.cfg.key)}"></label>
    <div class="hint" style="margin-top:10px">Status: <b>${DB.status === 'on' ? 'Terhubung' : DB.status === 'local' ? 'Mode lokal (data hanya di perangkat ini)' : DB.status === 'sync' ? 'Menyimpan…' : 'Belum tersambung'}</b>
      ${DB.lastSync ? '<br>Sinkron terakhir: ' + hhmm(DB.lastSync) : ''}${DB.lastErr ? '<br>Error terakhir: ' + esc(DB.lastErr) : ''}${n ? `<br>${n} data menunggu dikirim.` : ''}</div>
    <button class="btn" id="sc">Simpan &amp; sambungkan</button>
    <button class="btn ghost" id="sn">Sinkronkan sekarang</button>
    <div class="hint" style="margin-top:8px">Perangkat lain cukup membuka link web yang sama; koneksi sudah tertanam. Jangan pernah memasukkan password database atau service_role key ke sini.</div></div>`;
  $('#sc', el).onclick = async () => {
    DB.cfg = { url: $('#cu', el).value.trim(), key: $('#ck', el).value.trim() }; lsSet('cfg', DB.cfg);
    if (!DB.online()) { DB.status = 'local'; setStatus(); return vOwner(); }
    for (const [id, d] of Object.entries(DB.docs)) DB.pending[id] = d;
    toast('Menyambungkan…'); await DB.pull(); await DB.flush(); vOwner();
    toast(DB.status === 'on' ? 'Tersambung ✓' : 'Gagal tersambung. Cek URL & key.', 4000);
  };
  $('#sn', el).onclick = async () => { toast('Sinkronisasi…'); await DB.pull(); await DB.flush(); vOwner(); };
}

/* ---------- RIWAYAT UBAH ---------- */
function oLog(el) {
  const items = [];
  [...DB.list('trx').map(d => ['Transaksi', d, d.customerName + ' · ' + d.jumlah + ' galon']), ...DB.list('exp').map(d => ['Pengeluaran', d, d.kategori + ' · ' + rp(d.jumlahBiaya)])].forEach(([k, d, lbl]) => (d.log || []).forEach(l => items.push({ k, lbl, d, ...l })));
  items.sort((a, b) => b.at.localeCompare(a.at));
  el.innerHTML = `<div class="card"><h2>Riwayat perubahan</h2><div class="hint" style="margin-bottom:8px">Siapa yang mengubah atau menghapus transaksi/pengeluaran, kapan, dan alasannya. ${CACHE_DAYS} hari terakhir.</div>
    <div class="list">${items.length ? items.slice(0, 100).map(i => `<div class="item"><div class="main"><div class="t">${esc(i.aksi)} ${esc(i.k.toLowerCase())}: ${esc(i.lbl)}</div><div class="s">${esc(i.oleh)} · ${fmtTglS(dstr(new Date(i.at)))} ${hhmm(new Date(i.at))}${i.ket ? ' · ' + esc(i.ket) : ''}</div></div></div>`).join('') : '<div class="empty">Belum ada perubahan.</div>'}</div></div>`;
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  DB.init();
  const ov = lsGet('timeOverride', null); if (ov) { const d = new Date(ov); if (!isNaN(d)) TIME_OVERRIDE = d; }
  if (!DB.online() || DB.get('settings')) seedIfEmpty();   // perangkat baru yang online: tunggu data online dulu
  shell(); render(); pickKasir();
  if (DB.online()) { await DB.pull(); if (DB.status !== 'off') seedIfEmpty(); shell(); render(); }
  let lastDay = today();
  setInterval(() => { tickClock(); if (today() !== lastDay) { lastDay = today(); if (!$('#scrim')) render(); } }, 15000);
  setInterval(async () => { if (document.hidden || !DB.online()) return; await DB.pull(); softRefresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && DB.online()) DB.pull().then(softRefresh); });
  window.addEventListener('online', () => DB.flush());
})();

</script>
